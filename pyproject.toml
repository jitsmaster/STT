[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stt"
version = "0.0.1"
description = "Local speech-to-text daemon and bake-off harness for DeepSeek Harness voice control"
requires-python = ">=3.12"
dependencies = ["numpy", "soundfile", "sounddevice", "faster-whisper", "sherpa-onnx"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
