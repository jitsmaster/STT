# host = "127.0.0.1"          # loopback only; anything else is refused at startup
# port = 8890
# state_dir = "C:/Users/<you>/.dsh/tts"   # default: DSH_TTS_STATE_DIR, else DSH_HOME/tts, else ~/.dsh/tts
device = "soundcore"          # index or name fragment; run "python -m stt devices"; omit for the system default
hotkey = "ctrl+alt+v"         # must not be ctrl+alt+m (the TTS-stop hotkey)
command_engine = "faster-whisper:small"     # Task 10 decision; alternatives: "faster-whisper:medium" (slower, a little better on commands), "sensevoice:models/sensevoice" (0.1 s but weaker)
# dictation_engine = "faster-whisper:medium"  # omit to use the command engine for both
wake_enabled = false          # 码农 wake word: leave off until Task 10 says it ships
# wake_model_dir = "models/kws"
# wake_keywords = "keywords.txt"
# wake_threshold = 0.25
# wake_score = 1.5
# vad_model = "models/silero_vad.onnx"   # relative paths here are relative to this config file
# vad = "silero"              # "energy" accepts the weaker loudness gate; with "silero" a missing model stops startup
no_speech_s = 30.0            # how long to wait for speech after listening starts (default 5; raised 2026-10-14: 30 s to start talking)
silence_end_s = 15.0          # silence that ends an utterance (default 0.8; raised 2026-10-14 so thinking pauses do not cut you off; press the hotkey again to finish early)
max_utterance_s = 120.0        # hard cap on one listening window, waiting included (default 30; must exceed silence_end_s plus the longest dictation)
# min_speech_s = 0.25         # shorter blips are ignored
# end_words = ["over"]        # say one of these alone (a pause before and after it) to end the recording; it is never part of the transcript; [] turns it off
# end_gap_s = 0.6             # silence after a short burst before it is checked as an end word
# end_lead_gap_s = 0.4        # silence before the burst for it to count as a word of its own ("pass it over" with short gaps is never an end word)
glossary = ["worktree", "dsh-plugins", "sessionController", "PR", "handoff"]
